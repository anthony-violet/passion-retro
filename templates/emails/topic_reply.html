<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Nouvelle réponse</title>
</head>
<body style="margin:0;padding:0;background:#f4f1e8;color:#2c2c2c;font-family:Georgia,'Times New Roman',serif;">
    <div style="max-width:600px;margin:0 auto;padding:24px;">
        <div style="background:#ffffff;border:1px solid #d8d0bd;border-radius:6px;padding:24px;">
            <p style="margin:0 0 16px;">Bonjour {{ recipient.username }},</p>
            <p style="margin:0 0 16px;">
                <strong>{{ author.username }}</strong> a répondu au sujet
                <strong>« {{ topic.title }} »</strong> dans le forum
                <strong>{{ forum.name }}</strong> :
            </p>
            <blockquote style="margin:0 0 20px;padding:12px 16px;border-left:3px solid #8a2a1c;background:#faf7ef;color:#3a2f1f;">
                {{ excerpt }}
            </blockquote>
            <p style="margin:0 0 20px;">
                <a href="{{ post_url }}" style="display:inline-block;padding:10px 18px;background:#2a5caa;color:#ffffff;text-decoration:none;border-radius:4px;">Lire la réponse</a>
            </p>
            <p style="margin:0;font-size:12px;color:#777;line-height:1.5;">
                Vous recevez cet email car vous êtes abonné à ce sujet.<br>
                <a href="{{ unsubscribe_url }}" style="color:#2a5caa;">Se désabonner</a>
            </p>
        </div>
        <p style="margin:16px 0 0;font-size:11px;color:#999;text-align:center;">{{ site_name }}</p>
    </div>
</body>
</html>

{% if announcement_banner %}
<div class="announcement-banner" role="region" aria-label="Nouveauté">
    <span class="announcement-banner__badge">Nouveauté !</span>
    <a href="{% url 'announcement' %}" class="announcement-banner__text">{{ announcement_banner.banner }}</a>
    <a href="{% url 'announcement' %}" class="announcement-banner__more">En savoir plus ›</a>
    <form method="post" action="{% url 'close_announcement_banner' %}" class="announcement-banner__close-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="announcement-banner__close" aria-label="Fermer ce bandeau">✕</button>
    </form>
</div>
<style>
    .announcement-banner { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin: 0 0 10px; padding: .55rem .9rem;
        border: 1px solid var(--border-container); border-left: 4px solid var(--text-link-hover); border-radius: 6px;
        background: var(--bg-container); color: var(--text-primary); font-size: .92rem; }
    .announcement-banner__badge { font-weight: 800; text-transform: uppercase; font-size: .75em; letter-spacing: .06em;
        padding: .15rem .5rem; border-radius: 4px; background: var(--text-link-hover); color: #fff; }
    .announcement-banner__text { flex: 1; min-width: 12rem; color: inherit; font-weight: 600; text-decoration: none; }
    .announcement-banner__text:hover { text-decoration: underline; }
    .announcement-banner__more { white-space: nowrap; }
    .announcement-banner__close-form { margin: 0; }
    .announcement-banner__close { background: none; border: 0; cursor: pointer; color: inherit; font-size: 1rem; padding: .2rem .4rem; opacity: .7; }
    .announcement-banner__close:hover { opacity: 1; }
</style>
<script>
    document.addEventListener('submit', function (event) {
        var form = event.target;
        if (!form.classList || !form.classList.contains('announcement-banner__close-form')) return;
        event.preventDefault();
        var banner = form.closest('.announcement-banner');
        fetch(form.action, {
            method: 'POST', body: new FormData(form), credentials: 'same-origin',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        }).then(function (r) { if (!r.ok) throw new Error(); banner.remove(); })
          .catch(function () { form.submit(); });
    });
</script>
{% endif %}

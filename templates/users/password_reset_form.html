{% extends 'layout.html' %}
{% block content %}
    <div class="container">
        <h2>Mot de passe oublié</h2>
        <p class="auth-intro">Indique l'adresse e-mail de ton compte : on t'envoie un lien pour choisir un nouveau mot de passe.</p>
        <div class="auth-form">
            <form method="post" class="login-form">
                {% csrf_token %}
                {{ form.email.errors }}
                <p><input type="email" name="email" class="form-group" placeholder="Ton adresse e-mail" required autocomplete="email" value="{{ form.email.value|default:'' }}"></p>
                <button type="submit" class="btn-submit">Recevoir le lien</button>
            </form>
            <p><a href="{% url 'login' %}">Retour à la connexion</a></p>
        </div>
    </div>
{% endblock %}

{% load static %}
{% firstof folder current_folder as import_folder %}
<form action="{% url 'import' %}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}"
      method="POST"
      enctype="multipart/form-data">
    {% csrf_token %}
    <input type="hidden" name="folder" value="{{ import_folder }}">
    {{ form.as_p }}
    {% if form.errors %}
        <p class="error">
            {% for field in form %}{{ field.errors }}{% endfor %}
            {{ form.non_field_errors }}
        </p>
    {% endif %}
    <button type="submit" class="btn btn-add">Importer l'image</button>
</form>

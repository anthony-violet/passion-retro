<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Importer une image - NostalGeek</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .error { color: #b00020; margin: 10px 0; }
        .success { color: #1b7f3b; margin: 10px 0; }
        .btn { display: inline-block; padding: 6px 12px; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>
    {% if success %}
        <p class="success">Votre image a été ajoutée à la galerie.</p>
        <script>
            if (window.opener) {
                window.opener.postMessage({type: 'gallery-imported'}, window.location.origin);
            }
            setTimeout(function () { window.close(); }, 1200);
        </script>
    {% else %}
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        {% include 'gallery/_import_form.html' %}
    {% endif %}
</body>
</html>

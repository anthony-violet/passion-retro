{% extends 'layout.html' %}
{% load static %}

{% block extracss %}
    <link rel="stylesheet" href="{% static 'css/gallery.css' %}">
{% endblock %}

{% block content %}
    <div class="container">
        <h2>Importer des images</h2>
        {% if folder %}
            <p>Dossier de destination : <strong>{{ folder }}</strong></p>
        {% endif %}
        <form action="" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="folder" value="{{ folder }}">
            {{ form.as_p }}
            <button type="submit" class="btn btn-add">Importer les images</button>
            <a href="{% url 'home_gallery' %}{% if folder %}?folder={{ folder|urlencode }}{% endif %}"
               class="btn btn-default">Retour à la galerie</a>
        </form>
    </div>
{% endblock %}

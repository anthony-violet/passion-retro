{% extends 'panel/layout.html' %}

{% block panel_content %}
<div class="panel-page-header">
    <h2>{{ action }} un forum</h2>
    <a href="{% url 'panel_forum' %}" class="btn btn-small">← Retour</a>
</div>
<div class="panel-section">
    <form method="post" class="panel-form">
        {% csrf_token %}
        <div class="panel-form-group">
            <label>Catégorie</label>
            <select name="category" required>
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if forum.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="panel-form-group">
            <label>Nom</label>
            <input type="text" name="name" value="{{ forum.name|default:'' }}" required>
        </div>
        <div class="panel-form-group">
            <label>Description</label>
            <textarea name="description" rows="2">{{ forum.description|default:'' }}</textarea>
        </div>
        <div class="panel-form-actions">
            <button type="submit" class="btn btn-add">{{ action }}</button>
            <a href="{% url 'panel_forum' %}" class="btn btn-danger">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}

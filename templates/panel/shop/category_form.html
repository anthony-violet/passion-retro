{% extends 'panel/layout.html' %}
{% block panel_content %}
<div class="panel-page-header">
    <h2>{{ action }} une catégorie boutique</h2>
    <a href="{% url 'panel_shop' %}" class="btn btn-small">← Retour</a>
</div>
<div class="panel-section">
    <form method="post" class="panel-form">
        {% csrf_token %}
        <div class="panel-form-group"><label>Nom</label><input type="text" name="name" value="{{ category.name|default:'' }}" required></div>
        <div class="panel-form-group"><label>Description</label><textarea name="description" rows="2">{{ category.description|default:'' }}</textarea></div>
        <div class="panel-form-checkboxes">
            <label class="panel-checkbox"><input type="checkbox" name="is_active" {% if category.is_active|default:True %}checked{% endif %}> Active</label>
        </div>
        <div class="panel-form-actions">
            <button type="submit" class="btn btn-add">{{ action }}</button>
            <a href="{% url 'panel_shop' %}" class="btn btn-danger">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}

{% extends 'panel/layout.html' %}
{% block panel_content %}
<div class="panel-page-header">
    <h2>{{ action }} un item</h2>
    <a href="{% url 'panel_shop' %}" class="btn btn-small">← Retour</a>
</div>
<div class="panel-section">
    <form method="post" enctype="multipart/form-data" class="panel-form">
        {% csrf_token %}
        <div class="panel-form-grid">
            <div class="panel-form-group">
                <label>Nom</label>
                <input type="text" name="name" value="{{ item.name|default:'' }}" required>
            </div>
            <div class="panel-form-group">
                <label>Prix (en or)</label>
                <input type="number" name="price" value="{{ item.price|default:0 }}" min="0">
            </div>
            <div class="panel-form-group">
                <label>Catégorie</label>
                <select name="category" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if item.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="panel-form-group">
                <label>Image</label>
                <input type="file" name="image" accept="image/*">
                {% if item.image %}<small>Actuelle : {{ item.image }}</small>{% endif %}
            </div>
            <div class="panel-form-group panel-form-full">
                <label>Description</label>
                <textarea name="description" rows="3">{{ item.description|default:'' }}</textarea>
            </div>
        </div>
        <div class="panel-form-checkboxes">
            <label class="panel-checkbox"><input type="checkbox" name="is_active" {% if item.is_active|default:True %}checked{% endif %}> Actif</label>
        </div>
        <div class="panel-form-actions">
            <button type="submit" class="btn btn-add">{{ action }}</button>
            <a href="{% url 'panel_shop' %}" class="btn btn-danger">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
